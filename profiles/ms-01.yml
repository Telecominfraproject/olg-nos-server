# ms-01.yml - Compile-time machine profile for MS-01 mini PC
# Used by gen-loc-config to generate conf/lps/loc-config.bin
#
# Port layout (EVE host):
#   eth0  10G  0000:02:00.0  group14  -> PCIe passthrough -> VyOS LAN
#   eth1  10G  0000:02:00.1  group15  -> PCIe passthrough -> VyOS LAN
#   eth2  2.5G 0000:57:00.0  group16  -> PCIe passthrough -> VyOS WAN (i226-V)
#   eth3  2.5G 0000:58:00.0  group17  -> LMP (Switch NI bridge -> VyOS, CPlane)
#                                        i226-LM — AMT/vPro-capable, used
#                                        for out-of-band management.
#
# Cable convention on the back panel:
#   - LMP cable plugs into the i226-LM 2.5G port (eth3 / PCI 0000:58:00.0).
#   - WAN cable plugs into the i226-V  2.5G port (eth2 / PCI 0000:57:00.0).
#   - Two SFP+ cages carry the 10G LAN data plane.
#
# Interface mapping inside VyOS (PCI enumeration order):
#   eth0   -> VirtIO LMP NIC (CPlane bridge member, br0)
#   eth1   -> host eth2  (PCIe 2.5G WAN, 0000:57:00.0, i226-V)
#   eth2   -> host eth0  (PCIe 10G LAN, 0000:02:00.0)
#   eth3   -> host eth1  (PCIe 10G LAN, 0000:02:00.1)
#
# Two-bridge design (matches qemu profile):
#   br0 = CPlane bridge: LMP VIF (eth0) only. EVE's udhcpc gets the
#         static-mapping lease 192.168.33.2 here; VyOS-side gw 192.168.33.1.
#   br1 = LAN bridge: data-plane PCIe ports (eth2, eth3) for downstream
#         clients. Independent subnet from CPlane.

name: vyos

image:
  url: http://localhost:8888/images/small-vyos-ssh-nat.qcow2
  sha256: 9c366e944206e5c04b5b8e67f297a2c1dce0a5d4d45a7773060230ab8c3a12fd
  format: qcow2
  size: 805175296  # bytes

vm:
  memory_mb: 24576
  cpus: 20
  vnc: true

# LMP (Local Management Port): bridged to a Switch network instance.
# eth3 = onboard 2.5G NIC (i226-LM, PCI 0000:58:00.0); becomes a
# member of br0/CPlane inside VyOS. The i226-LM variant exposes
# Intel AMT/vPro, so OOB management (remote KVM, power, SOL) rides
# this same port — see research-ms01-amt.md for provisioning.
lmp: eth3

# Management uplink: EVE's own outbound goes through VyOS over the
# CPlane bridge — there's no separate mgmt NIC on ms-01. Same physical
# port as `lmp`; EVE's NIM treats bn1 (the LMP Switch NI bridge) as
# its uplink and reaches the controller via VyOS NAT on br0.
mgmt_uplink: eth3

# PCIe passthrough interfaces — presented to VyOS in PCI order.
# pci + assigngrp from controller-model.json (installer-generated).
# Order chosen so VyOS sees WAN at eth1 and the two 10G LAN NICs at eth2/eth3.
interfaces:
  - name: eth2
    type: pcie
    pci: "0000:57:00.0"
    assigngrp: "group16"
  - name: eth0
    type: pcie
    pci: "0000:02:00.0"
    assigngrp: "group14"
  - name: eth1
    type: pcie
    pci: "0000:02:00.1"
    assigngrp: "group15"

vnc_passwd: "eve"

ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKFz5k4h6F0KEKmxygyHTfNY+eJuHr3KenhWkZALxmyM vm@eveos-dev"

output: conf/lps/loc-config.bin

vyos:
  wan: eth1
  lmp_name: eth0

  # Control-plane bridge (br0). LMP VIF only. EVE's udhcpc lands here
  # and gets the static lease below; future NATS bus binds here.
  # Same 192.168.33.0/24 as the qemu profile so the EVE-side client-id
  # (pkg/lps/lmp.go RFC 4361 DUID-EN) doesn't need per-profile tuning.
  cplane:
    subnet: 192.168.33.0/24
    gateway: 192.168.33.1
    dhcp_range_start: 192.168.33.100
    dhcp_range_stop: 192.168.33.200
    eve_lmp_ip: 192.168.33.2

  # Data-plane LAN bridge (br1). The two onboard 10G NICs.
  # eth2 and eth3 here are INSIDE-VyOS names — eth2 = host eth0
  # (PCIe 10G), eth3 = host eth1 (PCIe 10G). The LMP port (host eth3
  # / VyOS eth0) is intentionally NOT in this list — it belongs to
  # br0/CPlane.
  lan:
    - eth2
    - eth3
  lan_subnet: 192.168.1.0/24
  lan_gateway: 192.168.1.1
  dhcp_range_start: 192.168.1.100
  dhcp_range_stop: 192.168.1.200
  hostname: vyos-gw
  name_servers:
    - 8.8.8.8
    - 8.8.4.4
  ci_output: conf/lps/vyos-ci.iso
  commands:
    - set service ssh port 22
