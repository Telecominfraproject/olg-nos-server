agent:
  name: vyos-nats-agent
  version: 0.1.0
  target: vyos
  state_file: /opt/olg/state/vyos-nats-agent.json
  configure:
    mode: real
  apply:
    save_after_commit: false
  actions:
    mode: real
    enabled:
      - trace
      - rtty

agentcore:
  nats:
    servers:
      - tls://192.168.254.2:4222
    client_name: vyos-nats-agent
    credentials_file: /etc/olg/secrets/vyos_agent.creds
    retry_on_failed_connect: false
    max_reconnects: -1
    reconnect_wait: 2s
    tls:
      enabled: true
      insecure_skip_verify: false
      ca_file: /etc/olg/secrets/ca.crt
      server_name: nats-server

  jetstream:
    default_timeout: 5s

  kv:
    bucket: cfg_desired
    key_pattern: desired.%s
    auto_create_bucket: false

  subjects:
    configure_pattern: cmd.configure.%s
    action_pattern: cmd.action.%s.%s
    result_pattern: result.%s
    status_pattern: status.%s
    health_pattern: health.%s
