set timeout=2
set default=0

menuentry "Install OLG Enterprise Appliance (Unattended)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz quiet autoinstall ds=nocloud\;s=/cdrom/autoinstall/ intel_iommu=on amd_iommu=on iommu=pt console=tty0 console=ttyS0,115200n8 ---
    initrd  /casper/initrd
}

menuentry "Install OLG Enterprise Appliance (Verbose Debug)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/autoinstall/ intel_iommu=on amd_iommu=on iommu=pt console=tty0 console=ttyS0,115200n8 ---
    initrd  /casper/initrd
}
